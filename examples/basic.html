<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>slosh — basic</title>
<style>
  *,*::before,*::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #06142e;
    color: #fff;
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
  }
  #tank { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .ui {
    position: fixed; left: 0; right: 0; bottom: max(24px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; align-items: center; gap: 14px;
  }
  button {
    font: inherit; letter-spacing: .12em; text-transform: uppercase; font-size: 12px;
    padding: 13px 22px; border: 1px solid rgba(255,255,255,.35);
    background: rgba(6,20,46,.5); color: #fff; cursor: pointer;
    backdrop-filter: blur(6px);
  }
  button:hover { border-color: #7fc4ff; }
  p { margin: 0; opacity: .55; font-size: 12.5px; letter-spacing: .08em; text-transform: uppercase; }
</style>
</head>
<body>
  <canvas id="tank"></canvas>
  <div class="ui">
    <button id="splash">Splash</button>
    <p id="hint">Tilt your phone · shake it</p>
  </div>

  <script type="module">
    import { createSlosh } from "../src/index.js";

    const slosh = createSlosh(document.getElementById("tank"), {
      level: 0.5,
      fallback: "pointer",     // on desktop the cursor tilts the surface
    });
    slosh.start();

    document.getElementById("splash").addEventListener("click", () => slosh.splash(1));

    if (slosh.status() === "waiting") {
      document.getElementById("hint").textContent =
        "Tap anywhere to enable motion";
    } else if (!matchMedia("(pointer: coarse)").matches) {
      document.getElementById("hint").textContent = "Move your cursor left and right";
    }
  </script>
</body>
</html>
